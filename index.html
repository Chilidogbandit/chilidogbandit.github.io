<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drift — Fly Fishing Journal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f7f4; --sidebar: #1f2e1f; --panel: #f4f7f4; --border: #d4e0d4;
      --accent: #6db87a; --accent2: #4a8c5c; --text: #1a2e1a; --muted: #7a9a7d;
      --card: #eaf0ea; --danger: #c0392b; --star: #c8920a;
      --river: #4a9eca; --lake: #8b6fb5;
      --detail-bg: #ffffff;
    }
    html, body { height: 100%; overflow: hidden; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
    #app { display: flex; height: 100vh; }

    /* ── Sidebar ── */
    #sidebar {
      width: 64px; background: var(--sidebar); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center;
      padding: 16px 0; gap: 4px; z-index: 1000; flex-shrink: 0;
    }
    .logo { width: 44px; height: 28px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; }
    .logo svg { width: 44px; height: 28px; }
    .nav-btn {
      width: 48px; height: 52px; border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; cursor: pointer; border: none; background: transparent;
      color: #4a6a4a; transition: all 0.2s; font-family: 'DM Sans', sans-serif;
    }
    .nav-btn span { font-size: 10px; font-weight: 500; letter-spacing: 0.3px; color: inherit; }
    .nav-btn:hover { color: #ffffff; background: rgba(255,255,255,0.1); }
    .nav-btn.active { color: #6db87a; background: rgba(109,184,122,0.18); }
    .nav-btn svg { width: 20px; height: 20px; }

    /* ── Views ── */
    #view-map, #view-journal, #view-flies, #view-locations { flex: 1; display: none; overflow: hidden; }
    #view-map.active, #view-journal.active { display: flex; }
    #view-flies.active, #view-locations.active { display: flex; }
    #view-flies, #view-locations { background: var(--bg); flex-direction: column; }

    /* ══ MAP ══ */
    #map { flex: 1; height: 100%; }
    .leaflet-popup-content-wrapper {
      background: #ffffff; border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); box-shadow: 0 4px 20px rgba(20,50,20,0.15);
      padding: 0; overflow: hidden; min-width: 280px;
    }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-content { margin: 0 !important; width: auto !important; }
    .leaflet-popup-close-button { color: var(--muted) !important; top: 10px !important; right: 12px !important; font-size: 18px !important; }
    .popup-inner { padding: 16px; }
    .popup-spot-name { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; margin-bottom: 4px; padding-right: 20px; }
    .popup-meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .popup-entries { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; margin-bottom: 12px; }
    .popup-entry-card { background: var(--card); border-radius: 8px; padding: 10px 12px; border: 1px solid var(--border); }
    .popup-entry-card .entry-date { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .popup-entry-card .entry-rating { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--star); font-weight: 500; }
    .popup-entry-card .entry-flies { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .popup-entry-card .entry-notes { font-size: 12px; color: var(--text); margin-top: 4px; line-height: 1.4; }
    .popup-add-btn {
      width: 100%; padding: 9px; border-radius: 8px; background: var(--accent); border: none; color: #0f1410;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.2s; color: #ffffff;
    }
    .popup-add-btn:hover { background: #5aa868; }
    #map-hint {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(244,247,244,0.92); backdrop-filter: blur(8px);
      border: 1px solid var(--border); border-radius: 20px;
      padding: 8px 16px; font-size: 13px; color: var(--muted);
      z-index: 800; pointer-events: none; white-space: nowrap; color: var(--text);
    }

    /* ── Modals ── */
    #modal-overlay, #fly-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: none; align-items: center; justify-content: center; z-index: 9999;
    }
    #modal-overlay.open { display: flex; }
    #fly-modal-overlay.open { display: flex; z-index: 10002; }
    #modal, #fly-modal {
      background: #ffffff; border: 1px solid var(--border);
      border-radius: 16px; padding: 28px; width: 460px; max-width: 95vw;
      box-shadow: 0 24px 64px rgba(20,50,20,0.15); max-height: 90vh; overflow-y: auto;
    }
    #fly-modal { width: 400px; }
    #modal h2, #fly-modal h2 { font-family: 'Playfair Display', serif; font-size: 20px; margin-bottom: 4px; }
    #modal .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 5px; letter-spacing: 0.5px; text-transform: uppercase; }
    .field input, .field textarea, .field select {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 12px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 14px; transition: border-color 0.2s; outline: none;
    }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 80px; }
    .field select option { background: var(--card); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-primary {
      flex: 1; padding: 10px; border-radius: 8px; background: var(--accent); border: none; color: #0f1410;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; color: #ffffff;
    }
    .btn-primary:hover { background: #5aa868; }
    .btn-secondary {
      padding: 10px 18px; border-radius: 8px; background: transparent; border: 1px solid var(--border); color: var(--muted);
      font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.2s;
    }
    .btn-secondary:hover { border-color: var(--muted); color: var(--text); }

    /* Water type toggle in entry form */
    .water-type-toggle { display: flex; gap: 8px; }
    .water-type-btn {
      flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex;
      align-items: center; justify-content: center; gap: 6px;
    }
    .water-type-btn:hover { border-color: var(--muted); color: var(--text); }
    .water-type-btn.active[data-type="River"] { background: rgba(74,158,202,0.15); border-color: var(--river); color: var(--river); }
    .water-type-btn.active[data-type="Lake"]  { background: rgba(139,111,181,0.15); border-color: var(--lake); color: var(--lake); }

    /* ── Fly Selector ── */
    .fly-selector { position: relative; }
    .fly-chips {
      min-height: 42px; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 6px;
      cursor: text; transition: border-color 0.2s;
    }
    .fly-chips.focused { border-color: var(--accent); }
    .fly-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(109,184,122,0.15); border: 1px solid var(--accent2);
      border-radius: 6px; padding: 3px 8px; font-size: 12px; color: var(--accent);
    }
    .fly-chip-remove {
      background: none; border: none; color: var(--accent); cursor: pointer;
      font-size: 14px; line-height: 1; padding: 0; display: flex; align-items: center;
    }
    .fly-chip-remove:hover { color: var(--danger); }
    .fly-search-input {
      border: none; background: transparent; outline: none; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 13px; min-width: 120px; flex: 1; padding: 2px 4px;
    }
    .fly-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 10001; max-height: 220px; overflow-y: auto; display: none;
    }
    .fly-dropdown.open { display: block; }
    .fly-dropdown-category {
      padding: 6px 12px 4px; font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--muted); border-top: 1px solid var(--border);
    }
    .fly-dropdown-category:first-child { border-top: none; }
    .fly-option {
      padding: 8px 14px 8px 20px; font-size: 13px; cursor: pointer; transition: background 0.15s;
      display: flex; align-items: center; gap: 8px;
    }
    .fly-option:hover { background: var(--card); }
    .fly-option.add-new { color: var(--accent); font-style: italic; padding-left: 14px; border-top: 1px solid var(--border); }
    .fly-option-cat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* ══ JOURNAL ══ */
    #view-journal { background: var(--bg); }
    #journal-list-panel { width: 320px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    #journal-list-header { padding: 24px 20px 16px; border-bottom: 1px solid var(--border); }
    #journal-list-header h1 { font-family: 'Playfair Display', serif; font-size: 26px; margin-bottom: 14px; }
    #add-entry-btn {
      width: 100%; padding: 9px; border-radius: 8px; background: var(--accent); border: none; color: #0f1410;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; margin-bottom: 12px; transition: background 0.2s; color: #ffffff;
    }
    #add-entry-btn:hover { background: #5aa868; }
    .filter-row { display: flex; gap: 8px; }
    .filter-select {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 10px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 12px; outline: none; cursor: pointer;
    }
    #journal-entries { flex: 1; overflow-y: auto; padding: 8px 0; }
    .journal-entry-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.15s;
    }
    .journal-entry-row:hover { background: var(--card); }
    .journal-entry-row.selected { background: rgba(109,184,122,0.08); }
    .jer-icon { width: 32px; height: 32px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .jer-icon svg { width: 16px; height: 16px; color: var(--accent); }
    .jer-info { flex: 1; min-width: 0; }
    .jer-date { font-size: 13px; font-weight: 500; }
    .jer-spot { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .jer-arrow { color: var(--muted); font-size: 14px; }
    #journal-detail { flex: 1; display: flex; align-items: center; justify-content: center; overflow-y: auto; padding: 32px; background: #ffffff; }
    #detail-placeholder { text-align: center; color: var(--muted); }
    #detail-placeholder svg { width: 48px; height: 48px; opacity: 0.3; margin-bottom: 12px; }
    #detail-content { display: none; width: 100%; max-width: 560px; }
    #detail-content.visible { display: block; }
    .detail-spot { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 4px; }
    .detail-date { font-size: 14px; color: var(--muted); margin-bottom: 6px; }
    .detail-water-badge {
      display: inline-flex; align-items: center; gap: 5px;
      border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 500; margin-bottom: 14px;
    }
    .detail-rating { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; }
    .detail-rating .stars { color: var(--star); font-size: 18px; }
    .detail-rating .num { font-size: 14px; color: var(--muted); }
    .detail-section { margin-bottom: 18px; }
    .detail-section h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
    .detail-section p { font-size: 15px; line-height: 1.6; }
    .detail-flies-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .detail-fly-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(109,184,122,0.1); border: 1px solid var(--accent2);
      border-radius: 6px; padding: 4px 10px; font-size: 13px; color: var(--accent);
    }
    .detail-fly-chip .cat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .detail-actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn-edit { padding: 9px 20px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn-edit:hover { border-color: var(--accent); color: var(--accent); }
    .btn-delete { padding: 9px 20px; border-radius: 8px; background: transparent; border: 1px solid var(--border); color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .btn-delete:hover { border-color: var(--danger); color: var(--danger); }

    /* ══ SHARED PAGE STYLES (Flies + Locations) ══ */
    .page-header { padding: 28px 40px 0; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .page-header h1 { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 16px; }
    .page-tabs { display: flex; }
    .page-tab {
      padding: 10px 20px; border: none; background: transparent; color: var(--muted);
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer;
      border-bottom: 2px solid transparent; transition: all 0.2s; margin-bottom: -1px;
    }
    .page-tab:hover { color: var(--text); }
    .page-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .page-controls {
      padding: 16px 40px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex-shrink: 0;
    }
    .filter-pill {
      padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s;
    }
    .filter-pill:hover { border-color: var(--accent); color: var(--accent); }
    .filter-pill.active { background: rgba(109,184,122,0.15); border-color: var(--accent); color: var(--accent); }
    .view-toggle { display: flex; background: var(--card); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; margin-left: auto; }
    .view-toggle-btn { padding: 6px 14px; border: none; background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .view-toggle-btn.active { background: var(--accent); color: #0f1410; font-weight: 500; }
    .page-body { flex: 1; padding: 28px 40px; overflow-y: auto; }

    /* Shared leaderboard row */
    .lb-list { display: flex; flex-direction: column; gap: 10px; }
    .lb-list.hidden { display: none; }
    .lb-row {
      display: flex; align-items: center; gap: 16px; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 20px; transition: border-color 0.2s;
    }
    .lb-row:hover { border-color: var(--accent2); }
    .lb-rank { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; color: var(--muted); width: 32px; text-align: center; flex-shrink: 0; }
    .lb-list .lb-row:nth-child(1) .lb-rank { color: #d4a83a; }
    .lb-list .lb-row:nth-child(2) .lb-rank { color: #a0a0a0; }
    .lb-list .lb-row:nth-child(3) .lb-rank { color: #cd7f32; }
    .lb-name { flex: 1; font-size: 15px; font-weight: 500; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lb-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; flex-shrink: 0; }
    .lb-bar-wrap { width: 140px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
    .lb-bar { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
    .lb-stat { font-size: 13px; color: var(--muted); width: 70px; text-align: right; flex-shrink: 0; }
    .lb-avg { font-size: 12px; color: var(--star); width: 60px; text-align: right; flex-shrink: 0; }

    /* Shared chart */
    .chart-wrap { display: none; }
    .chart-wrap.visible { display: block; }
    .chart-bars { display: flex; align-items: flex-end; gap: 12px; height: 280px; padding-bottom: 32px; }
    .chart-bar-col { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 0; gap: 6px; height: 100%; justify-content: flex-end; }
    .chart-bar-fill { width: 100%; border-radius: 6px 6px 0 0; min-height: 4px; }
    .chart-bar-label { font-size: 11px; color: var(--muted); text-align: center; word-break: break-word; line-height: 1.3; margin-top: 6px; }
    .chart-bar-val { font-size: 12px; color: var(--text); font-weight: 500; }
    .no-data-msg { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 15px; }

    /* Flies tabs */
    #tab-top-flies, #tab-manage-flies { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    #tab-top-flies.active, #tab-manage-flies.active { display: flex; }

    /* Manage Flies */
    .manage-flies-toolbar {
      padding: 16px 40px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .manage-search {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; transition: border-color 0.2s;
    }
    .manage-search:focus { border-color: var(--accent); }
    .btn-add-fly { padding: 8px 16px; border-radius: 8px; background: var(--accent); border: none; color: #ffffff; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
    .btn-add-fly:hover { background: #5aa868; }
    #manage-flies-list { flex: 1; overflow-y: auto; padding: 0 40px 24px; }
    .cat-group { margin-top: 24px; }
    .cat-group-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; user-select: none; }
    .cat-group-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .cat-group-title { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; }
    .cat-group-count { font-size: 12px; color: var(--muted); }
    .cat-group-chevron { margin-left: auto; color: var(--muted); font-size: 12px; transition: transform 0.2s; }
    .cat-group.collapsed .cat-group-chevron { transform: rotate(-90deg); }
    .cat-group-flies { display: flex; flex-direction: column; gap: 2px; }
    .cat-group.collapsed .cat-group-flies { display: none; }
    .manage-fly-row { border-radius: 8px; border: 1px solid transparent; transition: border-color 0.15s, background 0.15s; overflow: hidden; }
    .manage-fly-row:hover { background: var(--card); border-color: var(--border); }
    .manage-fly-row-main { display: flex; align-items: center; gap: 12px; padding: 10px 12px; cursor: pointer; }
    .manage-fly-name { flex: 1; font-size: 14px; }
    .manage-fly-tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
    .manage-fly-tag.builtin { background: rgba(109,184,122,0.1); color: var(--muted); }
    .manage-fly-count-badge { font-size: 11px; color: var(--muted); min-width: 56px; text-align: right; }
    .manage-fly-actions { display: flex; gap: 6px; }
    .btn-icon { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-size: 13px; }
    .btn-icon.edit:hover { border-color: var(--accent); color: var(--accent); }
    .btn-icon.del:hover { border-color: var(--danger); color: var(--danger); }
    .manage-fly-detail { padding: 0 12px 12px 36px; display: none; }
    .manage-fly-detail.open { display: block; }
    .manage-fly-desc { font-size: 13px; color: var(--muted); line-height: 1.6; font-style: italic; }
    .manage-fly-desc.empty { color: var(--border); }

    /* Fly cat badge in leaderboard */
    .fly-cat-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; flex-shrink: 0; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .custom-marker { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    #firebase-notice {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: #ffffff; border: 1px solid var(--star); border-radius: 10px;
      padding: 12px 20px; z-index: 10000; font-size: 13px; color: var(--star);
      max-width: 480px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: none;
    }
    #firebase-notice a { color: var(--accent); text-decoration: underline; cursor: pointer; }

    /* ══ AUTH SCREEN ══ */
    #auth-screen {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 99999; flex-direction: column;
    }
    #auth-screen.hidden { display: none; }
    .auth-card {
      background: #ffffff; border: 1px solid var(--border);
      border-radius: 20px; padding: 40px 36px; width: 380px; max-width: 95vw;
      box-shadow: 0 16px 48px rgba(20,50,20,0.12);
      display: flex; flex-direction: column; align-items: center;
    }
    .auth-logo {
      background: #6db87a; border-radius: 14px;
      width: 60px; height: 40px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px; box-shadow: 0 4px 14px rgba(109,184,122,0.4);
    }
    .auth-logo svg { width: 52px; height: 34px; }
    .auth-title { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .auth-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; text-align: center; }
    .auth-divider { display: flex; align-items: center; gap: 12px; width: 100%; margin: 16px 0; }
    .auth-divider-line { flex: 1; height: 1px; background: var(--border); }
    .auth-divider span { font-size: 11px; color: var(--muted); font-weight: 500; }
    .auth-field { width: 100%; margin-bottom: 12px; }
    .auth-field input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 14px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    .auth-field input:focus { border-color: var(--accent); }
    .auth-btn-google {
      width: 100%; padding: 11px; border-radius: 10px;
      background: #ffffff; border: 1.5px solid var(--border); color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all 0.2s; margin-bottom: 4px;
    }
    .auth-btn-google:hover { border-color: var(--accent); background: var(--card); }
    .auth-btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }
    .auth-btn-primary {
      width: 100%; padding: 11px; border-radius: 10px;
      background: var(--accent); border: none; color: #ffffff;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.2s; margin-bottom: 8px;
    }
    .auth-btn-primary:hover { background: #5aa868; }
    .auth-toggle { font-size: 13px; color: var(--muted); margin-top: 8px; text-align: center; }
    .auth-toggle a { color: var(--accent); cursor: pointer; text-decoration: underline; font-weight: 500; }
    .auth-error { font-size: 12px; color: var(--danger); margin-top: 6px; text-align: center; min-height: 18px; }
    .auth-mode-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 16px; align-self: flex-start; }

    /* Sign out button in sidebar */
    .signout-btn {
      margin-top: auto; width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border: none; background: transparent;
      color: #4a6a4a; transition: all 0.2s; margin-bottom: 8px;
    }
    .signout-btn:hover { color: #ffffff; background: rgba(192,57,43,0.2); }
    .signout-btn svg { width: 18px; height: 18px; }
    .user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--accent); display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #ffffff; margin-top: auto; margin-bottom: 4px;
      flex-shrink: 0; cursor: default;
    }
  </style>
</head>

<div id="modal-overlay">

    <div class="field"><label>Spot Name</label><input type="text" id="f-title" placeholder="e.g. Deschutes River — Maupin Run" /></div>
    <div class="field"><label>Date</label><input type="date" id="f-date" /></div>
    <div class="field">
      <label>Water Type</label>
      <div class="water-type-toggle">
        <button class="water-type-btn active" data-type="River" onclick="setWaterType('River')">River</button>
        <button class="water-type-btn" data-type="Lake" onclick="setWaterType('Lake')">Lake</button>
      </div>
    </div>
    <div class="field"><label>Rating (1–10)</label><input type="number" id="f-rating" min="1" max="10" placeholder="8" /></div>
    <div class="field">
      <label>Flies Used</label>
      <div class="fly-selector" id="fly-selector">
        <div class="fly-chips" id="fly-chips" onclick="focusFlyInput()">
          <input class="fly-search-input" id="fly-search-input" type="text" placeholder="Search flies..."
            oninput="onFlySearch()" onkeydown="onFlyKeydown(event)" onfocus="openFlyDropdown()" />
        </div>
        <div class="fly-dropdown" id="fly-dropdown"></div>
      </div>
    </div>
    <div class="field"><label>Notes</label><textarea id="f-notes" placeholder="How was the water? What hatches did you see?"></textarea></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveEntry()">Save Entry</button>
    </div>
  </div>
</div>

<!-- Add/Edit Fly Modal -->
<div id="fly-modal-overlay">
  <div id="fly-modal">
    <h2 id="fly-modal-title">Add Fly</h2>
    <div style="margin-bottom:20px;"></div>
    <div class="field"><label>Fly Name</label><input type="text" id="fm-name" placeholder="e.g. Elk Hair Caddis" /></div>
    <div class="field">
      <label>Category</label>
      <select id="fm-category">
        <option value="Dry Fly">Dry Fly</option>
        <option value="Nymph">Nymph</option>
        <option value="Streamer">Streamer</option>
        <option value="Wet Fly">Wet Fly</option>
      </select>
    </div>
    <div class="field">
      <label>Description <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
      <textarea id="fm-desc" placeholder="Notes about this fly — when to use it, what it imitates, favorite sizes..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeFlyModal()">Cancel</button>
      <button class="btn-primary" onclick="saveFlyModal()">Save Fly</button>
    </div>
  </div>
</div>



<script type="module">

  window.submitAuth = async function() {
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const name = document.getElementById('auth-name').value.trim();
    const errEl = document.getElementById('auth-error');
    errEl.textContent = '';
    if (!email || !password) { errEl.textContent = 'Please enter your email and password.'; return; }
    try {
      if (_authMode === 'signin') {
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        if (!name) { errEl.textContent = 'Please enter your name.'; return; }
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: name });
      }
    } catch(e) {
      const msgs = {
        'auth/user-not-found': 'No account with that email.',
        'auth/wrong-password': 'Incorrect password.',
        'auth/email-already-in-use': 'An account with that email already exists.',
        'auth/weak-password': 'Password must be at least 6 characters.',
        'auth/invalid-email': 'Please enter a valid email address.',

  // ── State ──
  window._state = { entries:[], selectedId:null, pendingLat:null, pendingLng:null, editingId:null, markers:{}, flies:[], selectedFlies:[], waterType:'River' };

  // ── Map ──
  const map = L.map('map',{zoomControl:true}).setView([44.0,-121.3],8);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri',maxZoom:19}).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{attribution:'',maxZoom:19}).addTo(map);

  map.on('click', function(e) {
    window._state.pendingLat = e.latlng.lat; window._state.pendingLng = e.latlng.lng; window._state.editingId = null;
    openModal('New Fishing Entry',`${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`,'','River',[],true);
  });

  function spotKey(e) { return `${parseFloat(e.lat).toFixed(5)}_${parseFloat(e.lng).toFixed(5)}`; }

  function getOrCreateMarker(entry) {
    const key = spotKey(entry);
    if (window._state.markers[key]) return window._state.markers[key];
    const wt = entry.waterType || 'River';
    const color = WATER_COLORS[wt] || '#6db87a';
    const icon = L.divIcon({ html:`<div class="custom-marker" style="background:${color}"></div>`, className:'', iconSize:[28,28], iconAnchor:[14,14] });
    const marker = L.marker([entry.lat,entry.lng],{icon}).addTo(map);
    marker.on('click',function(ev){L.DomEvent.stopPropagation(ev);openSpotPopup(key,entry.lat,entry.lng);});
    window._state.markers[key] = marker;
    return marker;
  }

  function openSpotPopup(key, lat, lng) {
    const spotEntries = window._state.entries.filter(e=>spotKey(e)===key);
    if (!spotEntries.length) return;
    const spotName = spotEntries[0].spotName;
    const wt = spotEntries[0].waterType || 'River';
    const entriesHtml = spotEntries.map(e=>{
      const flies = Array.isArray(e.flies)?e.flies:[];
      return `<div class="popup-entry-card">
        <div class="entry-date">${e.date}</div>
        <div class="entry-rating">★ ${e.rating}/10</div>
        ${flies.length?`<div class="entry-flies">${flies.join(', ')}</div>`:''}
        ${e.notes?`<div class="entry-notes">${e.notes}</div>`:''}
      </div>`;
    }).join('');
    const safeSpot = spotName.replace(/'/g,"\\'");
    const safeWt = wt.replace(/'/g,"\\'");
    L.popup({closeButton:true,maxWidth:320})
      .setLatLng([lat,lng])
      .setContent(`<div class="popup-inner">
        <div class="popup-spot-name">${spotName}</div>
        <div class="popup-meta">${''} ${wt} · ${spotEntries.length} entr${spotEntries.length!==1?'ies':'y'}</div>
        <div class="popup-entries">${entriesHtml}</div>
        <button class="popup-add-btn" onclick="window.openAddEntryForSpot('${key}',${lat},${lng},'${safeSpot}','${safeWt}')">+ Add Entry to This Spot</button>
      </div>`).openOn(map);
  }

  window.openAddEntryForSpot = function(key,lat,lng,spotName,wt) {
    map.closePopup();
    window._state.pendingLat=lat; window._state.pendingLng=lng; window._state.editingId=null;
    openModal('New Entry',spotName,spotName,wt||'River',[],false);
    document.getElementById('f-title').setAttribute('readonly',true);
  };

  // ── Water type selector ──
  window.setWaterType = function(type) {
    window._state.waterType = type;
    document.querySelectorAll('.water-type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===type));
  };

  // ── Entry Modal ──
  function openModal(title,sub,spotName,waterType,selectedFlies,titleEditable) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-sub').textContent = sub;
    document.getElementById('f-title').value = spotName;
    if (titleEditable) document.getElementById('f-title').removeAttribute('readonly');
    document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
    document.getElementById('f-rating').value = '';
    document.getElementById('f-notes').value = '';
    window.setWaterType(waterType||'River');
    window._state.selectedFlies = [...selectedFlies];
    renderFlyChips();
    document.getElementById('fly-search-input').value = '';
    closeFlyDropdown();
    document.getElementById('modal-overlay').classList.add('open');
  }

  window.closeModal = function() { document.getElementById('modal-overlay').classList.remove('open'); window._state.editingId=null; closeFlyDropdown(); };
  document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)window.closeModal();});

  // ── Fly Selector ──
  function catColor(flyName) { const f=window._state.flies.find(x=>x.name.toLowerCase()===flyName.toLowerCase()); return f?(CAT_COLORS[f.category]||'var(--muted)'):'var(--muted)'; }

  function renderFlyChips() {
    const container=document.getElementById('fly-chips'); const input=document.getElementById('fly-search-input');
    Array.from(container.children).forEach(c=>{if(c!==input)c.remove();});
    window._state.selectedFlies.forEach(flyName=>{
      const chip=document.createElement('div'); chip.className='fly-chip';
      chip.innerHTML=`<span style="width:6px;height:6px;border-radius:50%;background:${catColor(flyName)};flex-shrink:0;display:inline-block"></span>${flyName}<button class="fly-chip-remove" onclick="removeFlyChip('${flyName.replace(/'/g,"\\'")}')">×</button>`;
      container.insertBefore(chip,input);
    });
  }
  window.removeFlyChip=function(name){window._state.selectedFlies=window._state.selectedFlies.filter(f=>f!==name);renderFlyChips();};
  window.focusFlyInput=function(){document.getElementById('fly-search-input').focus();};
  window.onFlySearch=function(){renderFlyDropdown();openFlyDropdown();};
  window.openFlyDropdown=function(){renderFlyDropdown();document.getElementById('fly-dropdown').classList.add('open');document.getElementById('fly-chips').classList.add('focused');};
  function closeFlyDropdown(){document.getElementById('fly-dropdown').classList.remove('open');document.getElementById('fly-chips').classList.remove('focused');}

  function renderFlyDropdown() {
    const q=document.getElementById('fly-search-input').value.trim().toLowerCase();
    const already=window._state.selectedFlies.map(f=>f.toLowerCase());
    const available=window._state.flies.filter(f=>!already.includes(f.name.toLowerCase())&&(!q||f.name.toLowerCase().includes(q)));
    const grouped={};
    available.forEach(f=>{if(!grouped[f.category])grouped[f.category]=[];grouped[f.category].push(f);});
    let html='';
    CATEGORIES.forEach(cat=>{
      if(!grouped[cat]?.length)return;
      html+=`<div class="fly-dropdown-category">${cat}</div>`;
      html+=grouped[cat].map(f=>`<div class="fly-option" onclick="selectFly('${f.name.replace(/'/g,"\\'")}')"><span class="fly-option-cat-dot" style="background:${CAT_COLORS[f.category]}"></span>${f.name}</div>`).join('');
    });
    const exactMatch=window._state.flies.some(f=>f.name.toLowerCase()===q);
    if(q&&!exactMatch){const display=document.getElementById('fly-search-input').value.trim();html+=`<div class="fly-option add-new" onclick="addAndSelectFly('${display.replace(/'/g,"\\'")}')"> Add "${display}"</div>`;}
    if(!html)html=`<div class="fly-option" style="color:var(--muted);cursor:default;padding-left:14px">No flies found</div>`;
    document.getElementById('fly-dropdown').innerHTML=html;
  }

  window.selectFly=function(name){if(!window._state.selectedFlies.includes(name))window._state.selectedFlies.push(name);renderFlyChips();document.getElementById('fly-search-input').value='';closeFlyDropdown();document.getElementById('fly-search-input').focus();};
  window.addAndSelectFly=async function(name){
    if(!name)return;
    const newFly={name,category:'Dry Fly',builtin:false,description:''};
    if(usingFirebase){const ref=await addDoc(fliesCol,newFly);newFly.id=ref.id;}else{newFly.id='custom_'+Date.now();}
    window._state.flies.push(newFly);saveFliesLocal();window.selectFly(name);renderManageFlies();
  };
  window.onFlyKeydown=function(e){if(e.key==='Escape'){closeFlyDropdown();return;}if(e.key==='Backspace'&&!e.target.value&&window._state.selectedFlies.length){window._state.selectedFlies.pop();renderFlyChips();}};
  document.addEventListener('click',function(e){if(!document.getElementById('fly-selector').contains(e.target))closeFlyDropdown();});

  // ── Add/Edit Fly Modal ──
  window.openFlyModal=function(id){
    window._flyModalEditId=id;

  document.getElementById('fly-modal-overlay').addEventListener('click',function(e){if(e.target===this)window.closeFlyModal();});
  window.saveFlyModal=async function(){
    const name=document.getElementById('fm-name').value.trim();
    const category=document.getElementById('fm-category').value;
    const description=document.getElementById('fm-desc').value.trim();
    if(!name){alert('Please enter a fly name.');return;}
    const id=window._flyModalEditId;
    if(id){
      const idx=window._state.flies.findIndex(f=>f.id===id);
      if(idx>-1){window._state.flies[idx]={...window._state.flies[idx],name,category,description};if(usingFirebase)await updateDoc(doc(db,'flies',id),{name,category,description});}
    }else{
      const newFly={name,category,builtin:false,description};
      if(usingFirebase){const ref=await addDoc(fliesCol,newFly);newFly.id=ref.id;}else{newFly.id='custom_'+Date.now();}
      window._state.flies.push(newFly);
    }
    saveFliesLocal();window.closeFlyModal();renderManageFlies();
  };

  // ── Load / Save ──
  async function loadFlies(){
    if(usingFirebase){const snap=await getDocs(fliesCol);window._state.flies=snap.docs.map(d=>({id:d.id,...d.data()}));if(!window._state.flies.length)await seedStarterFlies();}
    else{const raw=localStorage.getItem('drift_flies');window._state.flies=raw?JSON.parse(raw):[];if(!window._state.flies.length)seedStarterFliesLocal();}
  }
  async function seedStarterFlies(){for(const f of STARTER_FLIES){const ref=await addDoc(fliesCol,f);window._state.flies.push({id:ref.id,...f});}}
  function seedStarterFliesLocal(){window._state.flies=STARTER_FLIES.map((f,i)=>({id:`builtin_${i}`,...f}));saveFliesLocal();}
  function saveFliesLocal(){if(!usingFirebase)localStorage.setItem('drift_flies',JSON.stringify(window._state.flies));}

  async function loadEntries(){
    if(usingFirebase){const snap=await getDocs(entriesCol);window._state.entries=snap.docs.map(d=>({id:d.id,...d.data()}));}
    else{const raw=localStorage.getItem('drift_entries');window._state.entries=raw?JSON.parse(raw):[];}
    window._state.entries=window._state.entries.map(e=>({...e,flies:Array.isArray(e.flies)?e.flies:(e.flies?e.flies.split(',').map(f=>f.trim()).filter(Boolean):[]),waterType:e.waterType||'River'}));
    window._state.entries.forEach(e=>getOrCreateMarker(e));
    renderJournalList();
  }
  function saveLocal(){if(!usingFirebase)localStorage.setItem('drift_entries',JSON.stringify(window._state.entries));}

  // ── Save Entry ──
  window.saveEntry=async function(){
    const title=document.getElementById('f-title').value.trim();
    const date=document.getElementById('f-date').value;
    const rating=parseInt(document.getElementById('f-rating').value);
    const waterType=window._state.waterType;
    const flies=window._state.selectedFlies;
    const notes=document.getElementById('f-notes').value.trim();
    if(!title||!date||isNaN(rating)||rating<1||rating>10){alert('Please fill in Spot Name, Date, and a valid Rating (1–10).');return;}
    const editingId=window._state.editingId;
    if(editingId){
      const idx=window._state.entries.findIndex(e=>e.id===editingId);
      if(idx>-1){window._state.entries[idx]={...window._state.entries[idx],spotName:title,date,rating,waterType,flies,notes};if(usingFirebase)await updateDoc(doc(db,'entries',editingId),{spotName:title,date,rating,waterType,flies,notes});saveLocal();}
    }else{
      const entry={spotName:title,lat:window._state.pendingLat,lng:window._state.pendingLng,date,rating,waterType,flies,notes};
      if(usingFirebase){const ref=await addDoc(entriesCol,entry);entry.id=ref.id;}else{entry.id=Date.now().toString();}
      window._state.entries.push(entry);saveLocal();getOrCreateMarker(entry);
    }
    window.closeModal();renderJournalList();
    if(window._state.selectedId===editingId)showDetail(editingId);
  };

  // ── Journal ──
  window.renderJournalList=function(){
    const sort=document.getElementById('filter-sort').value;
    const minRating=parseInt(document.getElementById('filter-rating').value);
    let entries=[...window._state.entries].filter(e=>e.rating>=minRating);
    if(sort==='date-desc')entries.sort((a,b)=>b.date.localeCompare(a.date));
    else if(sort==='date-asc')entries.sort((a,b)=>a.date.localeCompare(b.date));
    else if(sort==='rating-desc')entries.sort((a,b)=>b.rating-a.rating);
    else if(sort==='rating-asc')entries.sort((a,b)=>a.rating-b.rating);
    const container=document.getElementById('journal-entries');
    if(!entries.length){container.innerHTML=`<div style="padding:24px 20px;color:var(--muted);font-size:13px;text-align:center;">No entries yet. Head to the map to add your first spot!</div>`;return;}
    container.innerHTML=entries.map(e=>{
      const d=new Date(e.date+'T00:00:00');
      const dateStr=d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'});
      const sel=window._state.selectedId===e.id?' selected':'';
      const wtIcon='';
      return `<div class="journal-entry-row${sel}" onclick="window.selectEntry('${e.id}')">
        <div class="jer-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
        <div class="jer-info"><div class="jer-date">${dateStr} ${wtIcon}</div><div class="jer-spot">${e.spotName}</div></div>
        <div class="jer-arrow">›</div>
      </div>`;
    }).join('');
  };

  window.selectEntry=function(id){window._state.selectedId=id;renderJournalList();showDetail(id);};

  function showDetail(id){
    const e=window._state.entries.find(x=>x.id===id);if(!e)return;
    document.getElementById('detail-placeholder').style.display='none';
    document.getElementById('detail-content').classList.add('visible');
    document.getElementById('dc-spot').textContent=e.spotName;
    const d=new Date(e.date+'T00:00:00');
    document.getElementById('dc-date').textContent=d.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    const wt=e.waterType||'River';
    const badge=document.getElementById('dc-water-badge');
    badge.textContent=`${''} ${wt}`;
    badge.style.background=WATER_BG[wt]||'transparent';
    badge.style.color=WATER_COLORS[wt]||'var(--muted)';
    badge.style.border=`1px solid ${WATER_COLORS[wt]||'var(--border)'}`;
    const filled=Math.round(e.rating/2);
    document.getElementById('dc-stars').textContent='★'.repeat(filled)+'☆'.repeat(5-filled);
    document.getElementById('dc-rating-num').textContent=`${e.rating}/10`;
    const flies=Array.isArray(e.flies)?e.flies:[];
    const fliesSection=document.getElementById('dc-flies-section');
    if(flies.length){fliesSection.style.display='';document.getElementById('dc-flies').innerHTML=flies.map(f=>{const flyObj=window._state.flies.find(x=>x.name.toLowerCase()===f.toLowerCase());const color=flyObj?(CAT_COLORS[flyObj.category]||'var(--muted)'):'var(--muted)';return`<span class="detail-fly-chip"><span class="cat-dot" style="background:${color}"></span>${f}</span>`;}).join('');}
    else{fliesSection.style.display='none';}
    const notesSection=document.getElementById('dc-notes-section');
    if(e.notes){notesSection.style.display='';document.getElementById('dc-notes').textContent=e.notes;}else{notesSection.style.display='none';}
  }

  window.editSelectedEntry=function(){
    const id=window._state.selectedId;if(!id)return;
    const e=window._state.entries.find(x=>x.id===id);if(!e)return;
    window._state.editingId=id;
    const flies=Array.isArray(e.flies)?e.flies:[];
    openModal('Edit Entry',e.spotName,e.spotName,e.waterType||'River',flies,true);
    document.getElementById('f-date').value=e.date;
    document.getElementById('f-rating').value=e.rating;
    document.getElementById('f-notes').value=e.notes||'';
  };

  window.deleteSelectedEntry=async function(){
    const id=window._state.selectedId;if(!id)return;if(!confirm('Delete this entry?'))return;
    if(usingFirebase)await deleteDoc(doc(db,'entries',id));
    window._state.entries=window._state.entries.filter(e=>e.id!==id);saveLocal();
    window._state.selectedId=null;
    document.getElementById('detail-content').classList.remove('visible');
    document.getElementById('detail-placeholder').style.display='';
    Object.values(window._state.markers).forEach(m=>map.removeLayer(m));window._state.markers={};
    window._state.entries.forEach(e=>getOrCreateMarker(e));renderJournalList();
  };
  window.openAddEntryFromJournal=function(){alert('To add a new spot, switch to the Map view and click on your fishing location.');};

  // ══ TOP LOCATIONS ══
  function buildLocationsData(){
    const filter=window._locState.filter;
    const spotMap={};
    window._state.entries.forEach(e=>{
      const key=spotKey(e);
      if(!spotMap[key])spotMap[key]={name:e.spotName,waterType:e.waterType||'River',ratings:[],lat:e.lat,lng:e.lng};
      spotMap[key].ratings.push(e.rating);
      // waterType: use most recent entry's type
      spotMap[key].waterType=e.waterType||'River';
    });
    let spots=Object.values(spotMap).map(s=>({
      ...s,
      avg:(s.ratings.reduce((a,b)=>a+b,0)/s.ratings.length),
      count:s.ratings.length
    }));
    if(filter!=='all')spots=spots.filter(s=>s.waterType===filter);
    return spots.sort((a,b)=>b.avg-a.avg);
  }

  window.renderTopLocations=function(){
    const data=buildLocationsData();
    const lb=document.getElementById('loc-leaderboard');
    const cw=document.getElementById('loc-chart-wrap');
    const isChart=window._locState.viewMode==='chart';
    lb.classList.toggle('hidden',isChart);
    cw.classList.toggle('visible',isChart);
    if(!data.length){
      lb.innerHTML='<div class="no-data-msg">No location data yet — start logging entries on the map!</div>';
      document.getElementById('loc-chart-bars').innerHTML='<div class="no-data-msg">No data to chart yet.</div>';
      return;
    }
    const maxAvg=data[0].avg;
    lb.innerHTML=data.map((s,i)=>{
      const wt=s.waterType||'River';
      const color=WATER_COLORS[wt]||'var(--accent)';
      const bg=WATER_BG[wt]||'transparent';
      const badge=`<span class="lb-badge" style="background:${bg};color:${color}">${''} ${wt}</span>`;
      return`<div class="lb-row">
        <div class="lb-rank">${i+1}</div>
        <div class="lb-name">${s.name}</div>
        ${badge}
        <div class="lb-bar-wrap"><div class="lb-bar" style="width:${Math.round((s.avg/10)*100)}%;background:${color}"></div></div>
        <div class="lb-stat">${s.count} entr${s.count===1?'y':'ies'}</div>
        <div class="lb-avg">★ ${s.avg.toFixed(1)}</div>
      </div>`;
    }).join('');
    const top=data.slice(0,10);
    document.getElementById('loc-chart-bars').innerHTML=top.map((s,i)=>{
      const wt=s.waterType||'River';
      const color=WATER_COLORS[wt]||(i===0?'#d4a83a':'var(--accent)');
      const barH=Math.max(8,Math.round((s.avg/10)*220));
      return`<div class="chart-bar-col">
        <div class="chart-bar-val">${s.avg.toFixed(1)}</div>
        <div class="chart-bar-fill" style="height:${barH}px;background:${color}"></div>
        <div class="chart-bar-label">${s.name}</div>
      </div>`;
    }).join('');
  };

  window.setLocFilter=function(filter,btn){
    window._locState.filter=filter;
    document.querySelectorAll('#loc-controls .filter-pill').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');renderTopLocations();
  };
  window.setLocView=function(mode){
    window._locState.viewMode=mode;
    document.getElementById('loc-toggle-lb').classList.toggle('active',mode==='leaderboard');
    document.getElementById('loc-toggle-chart').classList.toggle('active',mode==='chart');
    renderTopLocations();
  };

  // ══ TOP FLIES ══
  function getSeasonMonths(s){if(s==='spring')return[3,4,5];if(s==='summer')return[6,7,8];if(s==='fall')return[9,10,11];if(s==='winter')return[12,1,2];return null;}

  function buildFliesData(){
    const months=getSeasonMonths(window._fliesState.season);
    const entries=window._state.entries.filter(e=>{if(!e.flies||!e.flies.length)return false;if(!months)return true;return months.includes(new Date(e.date+'T00:00:00').getMonth()+1);});
    const flyMap={};
    entries.forEach(e=>{(Array.isArray(e.flies)?e.flies:[]).forEach(fly=>{const key=fly.toLowerCase();if(!flyMap[key])flyMap[key]={name:fly,count:0,ratings:[]};flyMap[key].count++;if(e.rating)flyMap[key].ratings.push(e.rating);});});
    return Object.values(flyMap).map(f=>({...f,avg:f.ratings.length?(f.ratings.reduce((a,b)=>a+b,0)/f.ratings.length).toFixed(1):null})).sort((a,b)=>b.count-a.count);
  }

  window.renderTopFlies=function(){
    const data=buildFliesData();
    const lb=document.getElementById('flies-leaderboard');
    const cw=document.getElementById('flies-chart-wrap');
    const isChart=window._fliesState.viewMode==='chart';
    lb.classList.toggle('hidden',isChart);cw.classList.toggle('visible',isChart);
    if(!data.length){lb.innerHTML='<div class="no-data-msg">No fly data yet!</div>';document.getElementById('flies-chart-bars').innerHTML='<div class="no-data-msg">No data to chart yet.</div>';return;}
    const maxCount=data[0].count;
    lb.innerHTML=data.map((f,i)=>{
      const flyObj=window._state.flies.find(x=>x.name.toLowerCase()===f.name.toLowerCase());
      const cat=flyObj?.category||'';const color=CAT_COLORS[cat]||'var(--accent)';
      const catBadge=cat?`<span class="fly-cat-badge" style="background:${CAT_BG[cat]||'transparent'};color:${color}">${cat}</span>`:'';
      return`<div class="lb-row"><div class="lb-rank">${i+1}</div><div class="lb-name">${f.name}</div>${catBadge}<div class="lb-bar-wrap"><div class="lb-bar" style="width:${Math.round((f.count/maxCount)*100)}%;background:${color}"></div></div><div class="lb-stat">${f.count} ${f.count===1?'entry':'entries'}</div><div class="lb-avg">${f.avg?'★ '+f.avg:''}</div></div>`;
    }).join('');
    const top=data.slice(0,10);
    document.getElementById('flies-chart-bars').innerHTML=top.map((f,i)=>{
      const flyObj=window._state.flies.find(x=>x.name.toLowerCase()===f.name.toLowerCase());
      const color=CAT_COLORS[flyObj?.category]||(i===0?'#d4a83a':'var(--accent)');
      const barH=Math.max(8,Math.round((f.count/top[0].count)*220));
      return`<div class="chart-bar-col"><div class="chart-bar-val">${f.count}</div><div class="chart-bar-fill" style="height:${barH}px;background:${color}"></div><div class="chart-bar-label">${f.name}</div></div>`;
    }).join('');
  };

  window.setFliesSeason=function(season,btn){
    window._fliesState.season=season;
    document.querySelectorAll('#tab-top-flies .filter-pill').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');renderTopFlies();
  };
  window.setFliesView=function(mode){
    window._fliesState.viewMode=mode;
    document.getElementById('toggle-leaderboard').classList.toggle('active',mode==='leaderboard');
    document.getElementById('toggle-chart').classList.toggle('active',mode==='chart');
    renderTopFlies();
  };

  // ── Manage Flies ──
  window.renderManageFlies=function(){
    const q=(document.getElementById('manage-search').value||'').trim().toLowerCase();
    const usageCounts={};
    window._state.entries.forEach(e=>{(Array.isArray(e.flies)?e.flies:[]).forEach(f=>{usageCounts[f.toLowerCase()]=(usageCounts[f.toLowerCase()]||0)+1;});});
    let html='';
    CATEGORIES.forEach(cat=>{
      const flies=window._state.flies.filter(f=>f.category===cat&&(!q||f.name.toLowerCase().includes(q)));
      if(!flies.length)return;
      html+=`<div class="cat-group" id="catgroup-${cat.replace(' ','-')}">
        <div class="cat-group-header" onclick="toggleCatGroup('${cat}')">
          <div class="cat-group-dot" style="background:${CAT_COLORS[cat]}"></div>
          <div class="cat-group-title">${cat}</div>
          <div class="cat-group-count">${flies.length} flies</div>
          <div class="cat-group-chevron">▾</div>
        </div>
        <div class="cat-group-flies">
          ${flies.map(f=>{
            const count=usageCounts[f.name.toLowerCase()]||0;
            const tag=f.builtin?`<span class="manage-fly-tag builtin">Starter</span>`:'';
            const usage=count>0?`<span class="manage-fly-count-badge">Used ${count}×</span>`:`<span class="manage-fly-count-badge"></span>`;
            const isExpanded=window._expandedFlies.has(f.id);
            const desc=f.description?f.description:'<em>No description yet.</em>';
            const descClass=f.description?'manage-fly-desc':'manage-fly-desc empty';
            return`<div class="manage-fly-row">
              <div class="manage-fly-row-main" onclick="toggleFlyExpand('${f.id}')">
                <div class="manage-fly-name">${f.name}</div>
                ${tag} ${usage}
                <div class="manage-fly-actions" onclick="event.stopPropagation()">
                  <button class="btn-icon edit" title="Edit" onclick="openFlyModal('${f.id}')">✎</button>
                  <button class="btn-icon del" title="Delete" onclick="deleteFly('${f.id}','${f.name.replace(/'/g,"\\'")}')">✕</button>
                </div>
              </div>
              <div class="manage-fly-detail ${isExpanded?'open':''}"><div class="${descClass}">${desc}</div></div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });
    if(!html)html=`<div class="no-data-msg">No flies found.</div>`;
    document.getElementById('manage-flies-list').innerHTML=html;
  };

  window.toggleCatGroup=function(cat){document.getElementById('catgroup-'+cat.replace(' ','-')).classList.toggle('collapsed');};
  window.toggleFlyExpand=function(id){if(window._expandedFlies.has(id))window._expandedFlies.delete(id);else window._expandedFlies.add(id);renderManageFlies();};
  window.deleteFly=async function(id,name){
    if(!confirm(`Remove "${name}" from your fly list?`))return;
    if(usingFirebase)await deleteDoc(doc(db,'flies',id));
    window._state.flies=window._state.flies.filter(f=>f.id!==id);saveFliesLocal();renderManageFlies();
  };

  window.setFliesTab=function(tab){
    document.getElementById('ftab-top').classList.toggle('active',tab==='top');
    document.getElementById('ftab-manage').classList.toggle('active',tab==='manage');
    document.getElementById('tab-top-flies').classList.toggle('active',tab==='top');
    document.getElementById('tab-manage-flies').classList.toggle('active',tab==='manage');
    if(tab==='top')renderTopFlies();if(tab==='manage')renderManageFlies();
  };

  window.showView=function(view){
    ['map','journal','locations','flies'].forEach(v=>{
      document.getElementById(`view-${v}`).classList.toggle('active',v===view);
      document.getElementById(`btn-${v}`).classList.toggle('active',v===view);
    });
    if(view==='journal')renderJournalList();
    if(view==='locations')renderTopLocations();
    if(view==='flies'){renderTopFlies();renderManageFlies();}
  };

  // Init — Firebase auth listener handles load
  // Without Firebase config, the auth screen stays visible with a setup message
</script>
</body>
</html>
